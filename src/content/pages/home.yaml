signature_eyebrow: "Why GEO, why now"
signature_heading: "Your next customer might never see a search result again."
signature_lede: "Ask an AI engine about your industry today and it gives one answer, built from sources it trusts. Being findable isn't enough anymore — you have to be the source that gets cited. Here's the shift in practice:"
signature_old_label: "The old way"
signature_old_title: "Ten blue links"
signature_old_body: "A searcher scans a results page, weighs a handful of options, and picks one to click — with your brand as one voice among many."
signature_new_label: "The new way"
signature_new_title: "One synthesised answer"
signature_new_body: "An AI engine reads the web on the searcher's behalf and hands back a single recommendation. If your business isn't part of what it read and trusted, you were never in the running."

pillars_eyebrow: "What we do"
pillars_heading: "Three pillars, one strategy."
pillars:
  - label: "Earned Media"
    body: "News, thought leadership and case studies, mapped deliberately against your key messages — so every piece of coverage does a job, not just fills a clippings file."
  - label: "Owned Media"
    body: "Your website and social channels, built and written to work exceedingly hard: optimised for AI visibility and genuine human engagement, at the same time."
  - label: "Accolades"
    body: "Awards and accreditation selected with intent, chosen to reinforce the exact credibility signals your audiences — and the algorithms — are looking for."

method_eyebrow: "Our approach"
method_heading: "Audit. Activate. Track and adapt."
method_lede: "We start with a full-immersion session to get under the skin of your business, then run a repeatable rhythm:"
method:
  - step: "Audit & assess"
    body: "We benchmark your current footprint for visibility, sentiment, narrative and call-to-action — across search, social, and the AI engines now doing the recommending."
  - step: "Activate"
    body: "A bespoke PR & GEO strategy, delivered by specialists in media relations, SEO, award submissions, social and community engagement."
  - step: "Track & adapt"
    body: "We measure against the original benchmark and short, medium and long-term goals — staying as agile as the media and AI landscape we're operating in."

cta_heading: "Ready to be the answer, not just a result?"
cta_lede: "Tell us about your business and where you want to be known. We'll come back with a strategy, not a sales pitch."
cta_button: "Start the conversation"
