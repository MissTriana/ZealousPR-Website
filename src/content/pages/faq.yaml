seo_title: "FAQs — Zealous"
seo_description: "Answers to common questions about working with Zealous — PR, GEO, pricing, timelines and how we work."

hero_eyebrow: "FAQs"
hero_heading: "Questions, answered honestly."
hero_lede: "The things people usually ask before getting in touch. If yours isn't here, just ask directly."

faqs:
  - question: "What is GEO, and how is it different from SEO?"
    answer: "GEO (Generative Engine Optimisation) is about making sure AI engines like ChatGPT, Perplexity, and Google's AI Overviews cite your business when someone asks a relevant question. SEO optimises for ranking in a list of links; GEO optimises for being the source an AI trusts enough to reference directly. The two overlap — clean structure, credible content, and real authority help with both — but GEO also depends on things SEO doesn't, like structured data and being genuinely citable, not just findable."
  - question: "How long does it take to see results?"
    answer: "Earned media results (press coverage, thought leadership placement) can start within the first month. GEO improvements — AI engines actually citing you — typically take longer to show clearly, often three to six months, since it depends on AI models re-crawling and re-training on updated content. We set realistic short, medium and long-term benchmarks at the start of every engagement, not just a vague promise of results."
  - question: "Do you work with businesses outside the UK?"
    answer: "Yes. Most of our work is UK-based, but PR and GEO strategy translates well internationally, and we've supported companies entering new markets from a standing start."
  - question: "What size businesses do you work with?"
    answer: "Everything from one-person startups to large enterprises. What matters more than size is having something genuine to say and the appetite to invest in a real strategy rather than a one-off press release."
  - question: "Do you offer one-off projects, or only ongoing retainers?"
    answer: "Both, depending on the brief. Some clients need a defined project — a launch, an audit, a rebrand's worth of positioning. Others benefit from an ongoing retainer so momentum doesn't stall between campaigns. We'll recommend whichever actually fits your goals, not whichever is easier for us to sell."
  - question: "What's the difference between earned and owned media?"
    answer: "Earned media is coverage and endorsement you don't directly control — press articles, journalist mentions, industry awards. Owned media is what you fully control — your website, your social channels, your newsletter. Both matter, and increasingly both need to be built with AI visibility in mind, not just human readers."
  - question: "Can you help if we already have an in-house marketing team?"
    answer: "Yes — we regularly work alongside in-house teams, either leading PR and GEO specifically while marketing handles other channels, or supporting an in-house comms lead who needs specialist capacity or expertise they don't have internally."
  - question: "How much does it cost to work with Zealous?"
    answer: "It depends entirely on scope — a single project and an ongoing retainer are priced very differently. The honest answer is we won't know until we understand your brief, which is exactly what the first conversation is for."
